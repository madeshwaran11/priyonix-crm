
# ==========================================
# PRIYONIX CRM - APPLICATION CONFIGURATION
# ==========================================

spring.application.name=priyonix-crm
server.port=8080

# ==========================================
# LOAD LOCAL ENVIRONMENT FILE
# Run Spring Boot from the backend folder
# ==========================================

spring.config.import=optional:file:./.env[.properties]

# ==========================================
# MYSQL DATABASE
# Keep your existing working credentials
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/priyonix_crm
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# Preserve your existing settings if different
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# EMAIL DELIVERY - FORGOT PASSWORD EMAILS
# ==========================================
# MAIL_PROVIDER selects how emails are sent:
#   auto   -> Resend when RESEND_API_KEY is set, else Gmail SMTP
#   smtp   -> Gmail SMTP (works locally only)
#   resend -> Resend HTTPS API (required on Render)
#
# Render blocks outbound SMTP ports (25/465/587). Setting
# RESEND_API_KEY is enough to switch the deployed backend to
# Resend. See backend/.env.example
# ==========================================

app.mail.provider=${MAIL_PROVIDER:auto}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:}

# ==========================================
# GMAIL SMTP - LOCAL DEVELOPMENT ONLY
# Credentials are stored in backend/.env
# Not usable from Render's free tier.
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

# ==========================================
# SMTP CONNECTION TIMEOUTS
# ==========================================

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
